name: pr-checks
# 讀者（RULES §6）：本檔原本只吃 pull_request，而這個 repo 從第一個 commit 起
# **開過的 PR 數是 0**（全部直推 main）⇒ `gh run list --workflow pr-checks.yaml` 回傳 0 筆，
# 這五個 job 從未執行過一次。裡面的 portability-guard（禁 controller 專屬 annotation /
# storageClassName，本專案的可攜鐵律）因此從來沒有檢查過任何一行 manifest。
#
# 2026-08-10 補 push 觸發：讓它現在就有讀者＝每一次直推 main 的作者。
# 名字保留 pr-checks（errata/文件有引用）；它現在是「PR 與直推共用的廣覆蓋閘」。
# 與 hello-ci/spark-ci/dbt-ci 的 test job 有重疊，但那些 workflow 的 path filter 各自很窄，
# 重疊換來的是「任何一處改動都至少有一支閘看得到」。Actions 在 public repo 免費。
on:
  pull_request:
    paths:
      - "platform/hello/**"        # 含 k8s/**：manifest 改動也要過閘
      - "platform/argocd/**"
      - "ingestion/**"
      - "orchestration/airflow/**"
      - "lakehouse/**"
  push:
    branches: [main]
    paths:
      - "platform/hello/**"
      - "platform/argocd/**"
      - "ingestion/**"
      - "orchestration/airflow/**"
      - "lakehouse/**"
  workflow_dispatch: {}
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with: {python-version: "3.12"}
      - run: uv sync
        working-directory: platform/hello
      - run: uv run ruff check .
        working-directory: platform/hello
      - run: uv run pytest tests/ -v
        working-directory: platform/hello
  portability-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: no controller-specific annotation / storageClassName
        run: |
          if grep -rn "alb.ingress\|nginx\.ingress\|storageClassName" ingestion/ orchestration/ lakehouse/ platform/; then
            echo "可攜鐵律違反：發現專屬 annotation 或 storageClassName"; exit 1
          fi
          echo "portability OK"
  test-ingestion-dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with: {python-version: "3.12"}
      - run: |
          uv sync && uv run ruff check . && uv run pytest tests/ -v
        working-directory: ingestion/youtube
      - run: |
          uv venv /tmp/af-venv
          source /tmp/af-venv/bin/activate
          uv pip install "apache-airflow==3.2.2" "apache-airflow-providers-cncf-kubernetes" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.2.2/constraints-3.12.txt"
          uv pip install ./ingestion/youtube "pytest==9.1.1" "pyyaml==6.0.3"
          pytest orchestration/airflow/tests/ -v
  test-spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "17"}
      - uses: astral-sh/setup-uv@v8.3.2
        with: {python-version: "3.12"}
      - run: uv sync
        working-directory: lakehouse/spark
      - run: uv run ruff check jobs/ tests/
        working-directory: lakehouse/spark
      - run: uv run pytest tests/ -v
        working-directory: lakehouse/spark
  test-dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with: {python-version: "3.12"}
      - run: |
          uv venv /tmp/dbt-venv && source /tmp/dbt-venv/bin/activate
          uv pip install dbt-postgres==1.10.2
          DBT_PG_PASSWORD=dummy dbt parse --profiles-dir . --project-dir .
        working-directory: lakehouse/dbt
